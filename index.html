<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MBAACC-Browser</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
    pre { background: #000; padding: 1rem; overflow: auto; max-height: 24rem; }
    button { margin-right: .5rem; }
    .note { color: #fc6; }
  </style>
</head>
<body>
  <h1>MBAACC-Browser</h1>
  <p class="note">Early foundation. The game does <strong>not</strong> run yet. You must supply your own legally obtained MBAACC files; they are processed locally and never uploaded.</p>
  <p><label>Select your MBAACC folder: <input id="picker" type="file" webkitdirectory multiple /></label> <span id="count"></span></p>
  <p><button id="run" type="button" title="Not implemented yet">Launch (not implemented)</button><button id="copy" type="button">Copy log</button><button id="export" type="button" disabled>Export compatibility report (JSON)</button></p>
  <p id="status">No folder selected.</p>
  <pre id="log" aria-live="polite"></pre>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
